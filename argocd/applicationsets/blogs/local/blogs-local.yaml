apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: blogs-local
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: marketing-digest-blogs-local
  template:
    metadata:
      name: '{{name}}'
    spec:
      project: default
      sources:
        - repoURL: https://github.com/Yuvraj02/md-charts.git
          targetRevision: main
          path: blogs
          helm:
            valueFiles:
              - $values/blogs/local/values.yaml
        - repoURL: https://github.com/Yuvraj02/md-helm-values.git
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: marketing-digest
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
