apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: md-infra-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/Yuvraj02/md-infra.git
    targetRevision: main
    path: argocd
    # ApplicationSets live under argocd/applicationsets/<service>/<env>/ —
    # without recurse, Argo CD only looks at files directly under argocd/ and
    # finds nothing to sync.
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
